apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: secret-scanner-validating-webhook
webhooks:
  - name: validate.secret-scanner.svc
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
        scope: "Namespaced"
    clientConfig:
      service:
        name: secret-scanner-webhook-service
        namespace: default
        path: "/validate"
      caBundle: CA_BUNDLE_PLACEHOLDER
    admissionReviewVersions: ["v1"]
    sideEffects: None
    timeoutSeconds: 10
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["kube-system", "kube-public", "kube-node-lease"]
